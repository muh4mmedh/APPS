name: build

# Runs on pushes, on demand, and on version tags. A tag is what turns a build
# into a published release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release from release/VERSION'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Engine tests
        run: node tests/solver.test.cjs 5000

      - name: Install browser test deps
        run: |
          npm install --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: Browser tests
        run: node tests/browser.test.mjs

      - name: Icons are up to date
        run: python3 tools/make-icons.py --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: ignore

  android:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Signs with a real key when the secrets are set, otherwise the build
      # falls back to the debug key, which still installs.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APPS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "APPS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signing with the supplied release key"
          else
            echo "no release key in secrets — signing with the debug key, which still installs"
          fi

      - name: Build release APK
        working-directory: android
        env:
          APPS_KEYSTORE_PASSWORD: ${{ secrets.APPS_KEYSTORE_PASSWORD }}
          APPS_KEY_ALIAS: ${{ secrets.APPS_KEY_ALIAS }}
          APPS_KEY_PASSWORD: ${{ secrets.APPS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Check the APK holds the web app
        run: |
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "no apk was produced"
            exit 1
          fi
          echo "built: $apk"
          ls -lh "$apk"

          # The point of the APK is that the whole site is inside it, so fail
          # loudly rather than shipping an empty shell.
          unzip -l "$apk" > /tmp/apk-list.txt
          for needed in \
            assets/www/index.html \
            assets/www/manifest.webmanifest \
            assets/www/apps/rubiks-solver/index.html \
            assets/www/apps/rubiks-solver/js/solver.js \
            assets/www/assets/css/base.css \
            assets/www/assets/icons/apps-192.png ; do
            if ! grep -q "$needed" /tmp/apk-list.txt; then
              echo "missing from the apk: $needed"
              exit 1
            fi
          done
          if grep -q 'assets/www/apps/_template' /tmp/apk-list.txt; then
            echo "the starter template should not ship inside the apk"
            exit 1
          fi
          echo "apk contents look right"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: publish release
    needs: [test, android]
    # Either a v* tag, or a manual run with "publish" ticked. The tag is
    # created by the release itself in the manual case, so publishing never
    # depends on being able to push a tag.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk/

      - name: Put the APK where the packager looks for it
        run: |
          mkdir -p android/app/build/outputs/apk/release
          cp apk/*.apk android/app/build/outputs/apk/release/

      - name: Package everything
        run: release/build.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(tr -d ' \n\r' < release/VERSION)"
          fi
          version="${tag#v}"
          files=(release/dist/*.apk release/dist/*.zip release/dist/SHA256SUMS.txt)

          # Re-runnable: update the release if it is already there rather than
          # failing, so a botched publish can simply be run again.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "updating the existing $tag release"
            gh release edit "$tag" --title "Apps $version" --notes-file release/dist/notes.md
            gh release upload "$tag" "${files[@]}" --clobber
          else
            echo "creating the $tag release"
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Apps $version" \
              --notes-file release/dist/notes.md \
              "${files[@]}"
          fi
          gh release view "$tag" --json tagName,assets \
            --jq '"published \(.tagName) with \(.assets | length) files"'
