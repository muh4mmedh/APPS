plugins {
    id 'com.android.application'
}

// One version for the whole project, read from release/VERSION so the APK and
// the release artifacts can never disagree about what they are.
def versionFile = rootProject.file('../release/VERSION')
def appVersion = versionFile.exists() ? versionFile.text.trim() : '0.0.1'
def versionParts = appVersion.tokenize('.').collect { it.toInteger() }

// The site itself lives above this folder in the repo.
def siteRoot = rootProject.file('..')
def generatedAssets = layout.buildDirectory.dir('generated/assets').get().asFile

android {
    namespace 'dev.apps.collection'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.apps.collection'
        minSdk 24
        targetSdk 34
        versionName appVersion
        versionCode versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        resourceConfigurations += ['en']
    }

    // Sign release builds with a real key when one is supplied, otherwise fall
    // back to the debug key. That way `assembleRelease` always produces an APK
    // that will install, rather than an unsigned one that will not.
    def keystorePath = System.getenv('APPS_KEYSTORE')
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('APPS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('APPS_KEY_ALIAS')
                keyPassword System.getenv('APPS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The staged web files are picked up from the build folder alongside any
    // hand-written assets.
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', generatedAssets]
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // WebViewAssetLoader: serves the assets over https so the page counts as a
    // secure context and getUserMedia will hand over the camera.
    implementation 'androidx.webkit:webkit:1.11.0'
}

/*
 * Stage the site into the APK's assets before every build, so the app can
 * never ship a stale copy of the web files. `Sync` rather than `Copy` so a
 * file deleted from the repo also disappears from the APK.
 *
 * The file list mirrors what release/build.sh packages: everything the site
 * needs, minus the starter template, which is scaffolding rather than an app.
 * Keep the two in step.
 *
 * It lands in `www/` because the page is loaded from
 * https://appassets.androidplatform.net/assets/www/index.html
 */
def stageWebAssets = tasks.register('stageWebAssets', Sync) {
    description = "Copies the repo's web files into the APK assets."
    from(siteRoot) {
        include 'index.html'
        include 'manifest.webmanifest'
        include 'sw.js'
        include 'assets/**'
        include 'apps/**'
        exclude 'apps/_template/**'
    }
    into new File(generatedAssets, 'www')
    includeEmptyDirs = false
}

tasks.named('preBuild') { dependsOn stageWebAssets }
