<!doctype html>
<html lang="en" data-root="./">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apps</title>
<meta name="description" content="A small collection of self-contained web apps.">
<meta name="theme-color" content="#0a0c11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311141c'/%3E%3Crect x='6' y='6' width='8' height='8' rx='2' fill='%236f5cf6'/%3E%3Crect x='18' y='6' width='8' height='8' rx='2' fill='%2324d3a5'/%3E%3Crect x='6' y='18' width='8' height='8' rx='2' fill='%23ffbf3c'/%3E%3Crect x='18' y='18' width='8' height='8' rx='2' fill='%23fb5c6c'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apps-192.png">
<link rel="stylesheet" href="assets/css/base.css">
<style>
  .hero { padding: 26px 0 30px; display: grid; gap: 14px; max-width: 620px; }
  .hero h1 { font-size: clamp(1.9rem, 5vw, 2.7rem); letter-spacing: -0.035em; }
  .hero p { color: var(--text-dim); font-size: 1.02rem; }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .search {
    flex: 1; min-width: 200px; position: relative;
    display: flex; align-items: center; gap: 9px;
    height: 44px; padding: 0 14px;
    background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-md);
  }
  .search input {
    flex: 1; min-width: 0; appearance: none; border: 0; background: transparent;
    font: inherit; color: var(--text); outline: none;
  }
  .search input::placeholder { color: var(--text-faint); }
  .search__icon { color: var(--text-faint); flex: none; }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }

  .app-card {
    display: grid;
    grid-template-columns: 62px minmax(0, 1fr) 22px;
    gap: 15px;
    align-items: center;
    padding: 16px;
    text-decoration: none;
    background: linear-gradient(180deg, var(--raised), rgba(255, 255, 255, 0.015));
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    transition: border-color 0.18s var(--ease), transform 0.18s var(--ease),
                background 0.18s var(--ease), box-shadow 0.18s var(--ease);
  }
  .app-card:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--accent-app, var(--accent)) 55%, transparent);
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.36);
  }
  .app-card:hover .app-card__go { transform: translateX(3px); color: var(--text); }

  .tile {
    display: grid; place-items: center;
    width: 62px; height: 62px;
    border-radius: 15px;
    background: linear-gradient(145deg,
      color-mix(in srgb, var(--accent-app) 85%, #fff 0%),
      color-mix(in srgb, var(--accent-app) 45%, #06070b));
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    font-size: 26px;
  }
  .tile__mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5px; width: 38px; }
  .tile__mini i { aspect-ratio: 1; border-radius: 2.5px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }

  .app-card__body { display: grid; gap: 6px; min-width: 0; }
  .app-card__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .app-card__head h2 { font-size: 1.04rem; }
  .app-card__body p { font-size: 0.875rem; line-height: 1.45; }
  .app-card__tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
  .app-card__tags .chip { height: 22px; padding: 0 8px; font-size: 0.7rem; }
  .app-card__go { color: var(--text-faint); font-size: 1.1rem; transition: transform 0.18s var(--ease), color 0.18s var(--ease); }

  .empty { padding: 34px 18px; text-align: center; color: var(--text-dim); border: 1px dashed var(--line); border-radius: var(--r-lg); }

</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <span class="brandmark">◆</span>
    <div>
      <h1 class="topbar__title">Apps</h1>
      <p class="faint" style="font-size:.78rem">Self-contained, no build step</p>
    </div>
    <div class="topbar__spacer"></div>
    <span class="chip" id="count">0 apps</span>
  </header>

  <section class="hero">
    <h1>Everything I&rsquo;ve built, in one place.</h1>
    <p>Each app is a folder of plain HTML, CSS and JavaScript. Open one and it runs — nothing to install, nothing to compile.</p>
  </section>

  <div class="toolbar">
    <label class="search">
      <span class="search__icon" aria-hidden="true">⌕</span>
      <input id="search" type="search" placeholder="Search apps…" autocomplete="off" aria-label="Search apps">
    </label>
    <button class="btn btn--primary" id="install" type="button" hidden>Install</button>
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden></p>


</div>
<script src="assets/js/registry.js"></script>
<script src="assets/js/launcher.js"></script>
<script src="assets/js/install.js"></script>
</body>
</html>
